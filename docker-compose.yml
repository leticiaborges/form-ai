services:
  postgres:
    image: postgres:18
    container_name: form-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: form_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d form_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: